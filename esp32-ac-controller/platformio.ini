[env:esp32-c3-supermini]
; pioarduino 55.03.311: Arduino Core 3.3.11 / ESP-IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions/no_ota_preserve_fs.csv
build_src_filter = +<*> -<sleep_wake_diagnostic.cpp> -<sleep_wake_idf_diagnostic.cpp>
; SuperMini exposes the ESP32-C3 native USB Serial/JTAG port, not UART0.
; These two flags make Arduino's Serial object use that USB port from boot.
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

; IRremoteESP8266 provides decoding for common TV and air-conditioner protocols.
lib_deps =
  crankyoldgit/IRremoteESP8266 @ ^2.8.6
  adafruit/Adafruit SH110X
  adafruit/Adafruit SHT4x Library

[env:sleep-wake-diagnostic]
extends = env:esp32-c3-supermini
build_src_filter = -<*> +<sleep_wake_diagnostic.cpp>

[env:sleep-wake-idf-diagnostic]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
