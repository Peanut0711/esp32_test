[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; SuperMini exposes the ESP32-C3 native USB Serial/JTAG port, not UART0.
; These two flags make Arduino's Serial object use that USB port from boot.
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

; IRremoteESP8266 provides decoding for common TV and air-conditioner protocols.
lib_deps =
  crankyoldgit/IRremoteESP8266 @ ^2.8.6
  adafruit/Adafruit SH110X
  adafruit/Adafruit SHT4x Library
